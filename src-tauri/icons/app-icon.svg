<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon of FreeX Desktop (as in icon.ico): the FreeX logo (docs/brand/freex-logo.svg) on a
       dark rounded tile. The PNG icons of the app and the Linux package are rendered from it. -->
  <defs>
    <linearGradient id="fx" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d93b42"/><stop offset="0.22" stop-color="#da4041"/>
      <stop offset="0.55" stop-color="#e98a46"/><stop offset="1" stop-color="#f4b75c"/>
    </linearGradient>
    <mask id="fxplay" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M240.2 220.0 L302.6 256.0 L240.2 292.0 Z" fill="#000" stroke="#000" stroke-width="16" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="98" fill="#121821"/>
  <g transform="translate(256 256) scale(0.7) translate(-256 -256)">
    <path d="M156 156 L356 356 M356 156 L156 356" fill="none" stroke="url(#fx)" stroke-width="120" stroke-linecap="round" mask="url(#fxplay)"/>
  </g>
</svg>
