[package]
name = "freex-desktop"
version = "1.0.0"
description = "FreeX Desktop – the Windows app for FreeX Media Server"
authors = ["MirraNET, Niklas Linz <niklas.linz@mirranet.de>"]
license = "LGPL-3.0-only"
repository = "https://github.com/LinzN/freex-desktop"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "freex-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "process", "sync", "time", "macros"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
open = "5"
sys-locale = "0.3"
tauri-plugin-single-instance = "2"

[features]
# Set by release builds: serves the bundled ui/ instead of a dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
