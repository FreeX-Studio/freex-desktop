[package]
name = "freex-desktop"
version = "1.1.1"
description = "FreeX Desktop – the desktop app for FreeX Media Server (Windows and Linux)"
authors = ["MirraNET, Niklas Linz <niklas.linz@mirranet.de>"]
license = "LGPL-3.0-only"
repository = "https://github.com/FreeX-Studio/Freex-Desktop"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "freex-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "process", "sync", "time", "macros"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
open = "5"
sys-locale = "0.3"
tauri-plugin-single-instance = "2"
# The app window's native handle, for mpv's --wid (same version as Tauri uses).
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# Gives the keyboard to mpv inside the app window (same version as Tauri uses).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
# Set by release builds: serves the bundled ui/ instead of a dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
